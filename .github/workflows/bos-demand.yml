name: BOS demand framework
on:
  push:
    paths:
      - 'scripts/migrate-demand-ownership.js'
      - 'scripts/update-agents.ps1'
      - 'scripts/generate-plugin-thin-index.ps1'
      - 'scripts/tests/demand-ownership-migration.tests.js'
      - 'plugins/bos-plugin/**'
      - 'plugins/demand-delivery-plugin/scripts/commit-demand.js'
      - 'plugins/demand-delivery-plugin/**'
      - 'plugins/bos-plugin/scripts/demand-entry*.js'
      - 'plugins/demand-delivery-plugin/tests/demand-commit.test.js'
      - 'scripts/lib/workspace-context.js'
      - 'scripts/lib/WorkspaceContext.psm1'
      - 'scripts/tests/bos-plugin.tests.js'
      - 'workflows/bos-demand.workflow.md'
      - '.github/workflows/bos-demand.yml'
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test plugins/bos-plugin/tests/bos-demand-query.tests.js plugins/bos-plugin/tests/configuration.tests.js scripts/tests/bos-plugin.tests.js plugins/demand-delivery-plugin/tests/demand-commit.test.js plugins/demand-delivery-plugin/tests/commit-upstream-check.test.js
      - run: node --test scripts/tests/workspace-context.tests.js scripts/tests/standard-demand-entry.tests.js
      - run: node --test --test-name-pattern="project links resolve" scripts/tests/documentation-layout.tests.js
      - if: runner.os == 'Windows'
        shell: powershell
        run: |
          & ./scripts/tests/workspace-context.tests.ps1
          $env:BOS_TEST_POWERSHELL = 'powershell.exe'
          node --test scripts/tests/bos-plugin.tests.js scripts/tests/demand-ownership-migration.tests.js
