name: Workbench validation

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-stage:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ matrix.os == 'windows-latest' && '0' || '1' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts --prefix tools/agents-workbench/react
      - name: Build the interface
        run: npm --prefix tools/agents-workbench/react run build
      - name: Verify project binding and the staged runtime
        run: >-
          node --test
          tools/agents-workbench/prototype/personal-settings.test.js
          tools/agents-workbench/prototype/project-settings.test.js
          tools/agents-workbench/tests/configuration-files.test.js
          scripts/tests/project-configuration.tests.js
          tools/agents-workbench/tests/config-conflicts.test.js
          scripts/tests/project-plugin-settings.tests.js
          plugins/coding-iris-plugin/scripts/iris-tools/tests/frontend-encoding.test.js
          scripts/tests/iris-mcp-cli.tests.js
          scripts/tests/iris-session-routing.tests.js
          tools/agents-workbench/tests/deployment.test.js
          tools/agents-workbench/tests/project-context.test.js
          tools/agents-workbench/tests/update-note.test.js
          tools/agents-workbench/tests/task-owner-observations.test.js
          tools/agents-workbench/tests/project-recovery.test.js
          tools/agents-workbench/tests/state-export.test.js
          tools/agents-workbench/tests/overlay-update.test.js
          tools/agents-workbench/tests/knowledge.test.js
          tools/agents-workbench/tests/knowledge-build.test.js
          tools/agents-workbench/tests/manual-search.test.js
          tools/agents-workbench/tests/package-runtime.test.js
      - name: Verify Windows launch and original framework operations
        if: runner.os == 'Windows'
        run: >-
          node --test
          tools/agents-workbench/tests/parallel-launch.test.js
          tools/agents-workbench/tests/installed-owner.test.js
          tools/agents-workbench/tests/release-import.test.js
          tools/agents-workbench/tests/release-launcher.test.js
          tools/agents-workbench/tests/release-pin.test.js
          tools/agents-workbench/tests/pinned-owner.test.js
          tools/agents-workbench/tests/overlay-stock-pilot.test.js
          tools/agents-workbench/tests/vector-index.test.js
