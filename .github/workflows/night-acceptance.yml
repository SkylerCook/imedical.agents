name: Night acceptance contracts
on:
  push:
    paths: ['scripts/night-*.js', 'scripts/lib/workspace-context.js', 'scripts/validation-evidence.js', 'scripts/tests/test-session.tests.js', 'scripts/tests/test-evidence.tests.js', 'scripts/iris-mcp.js', 'scripts/tests/iris-mcp-schema.tests.js', 'scripts/tests/iris-mcp-cli.tests.js', 'scripts/run-acceptance.js', 'scripts/agent-orchestrator.js', 'scripts/lib/night-*.js', 'scripts/lib/acceptance-worker.js', 'scripts/lib/test-*.js', 'scripts/lib/playwright-runner.js', 'scripts/tests/night-*.tests.js', 'scripts/tests/*acceptance*', 'scripts/tests/playwright-runner.tests.js', 'plugins/coding-iris-plugin/scripts/iris-tools/debugger*.js', 'plugins/coding-iris-plugin/scripts/iris-tools/deploy-*.js', 'plugins/coding-iris-plugin/scripts/iris-tools/compile*.js', 'plugins/coding-iris-plugin/scripts/iris-tools/backend-document.js', 'plugins/coding-iris-plugin/scripts/iris-tools/prepare-deploy-manifest.js', 'scripts/tests/iris-deploy-manifest.tests.ps1', 'plugins/coding-iris-plugin/scripts/iris-tools/broker-client.js', 'plugins/coding-iris-plugin/scripts/iris-tools/tests/broker-client.test.js', 'workflows/bos-demand-unattended.workflow.md', 'maintenance/testing/playwright/**', '.github/workflows/night-acceptance.yml']
  pull_request:
  workflow_dispatch:
jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: ['22.5.0', '22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --prefix maintenance/testing/playwright
      - run: node maintenance/testing/playwright/node_modules/playwright-core/cli.js install --with-deps chromium
      - run: node --test scripts/tests/playwright-runner.tests.js plugins/coding-iris-plugin/scripts/iris-tools/tests/broker-client.test.js scripts/tests/test-session.tests.js scripts/tests/test-evidence.tests.js scripts/tests/night-acceptance-contract.tests.js
        env:
          PLAYWRIGHT_RUNTIME_MODULE: ${{ github.workspace }}/maintenance/testing/playwright/node_modules/playwright-core
          REQUIRE_PLAYWRIGHT: '1'
      - run: node --test scripts/tests/night-convergence.tests.js scripts/tests/night-policy.tests.js scripts/tests/night-policy-update.tests.js scripts/tests/night-contract-v2.tests.js scripts/tests/night-dispatch.tests.js scripts/tests/night-orchestration.tests.js scripts/tests/night-quota.tests.js scripts/tests/night-quota-dispatch.tests.js scripts/tests/night-workspace.tests.js scripts/tests/agent-orchestrator.tests.js scripts/tests/orchestration-results.tests.js scripts/tests/iris-mcp-schema.tests.js scripts/tests/iris-mcp-cli.tests.js plugins/bos-plugin/tests/night-entry.tests.js
      - run: node --test scripts/tests/night-plan.tests.js scripts/tests/night-governance.tests.js scripts/tests/night-integration.tests.js scripts/tests/night-client.tests.js scripts/tests/night-client-supervisor.tests.js scripts/tests/night-report.tests.js scripts/tests/night-quota-weekly.tests.js scripts/tests/night-browser-contract.tests.js scripts/tests/acceptance-worker.tests.js plugins/coding-iris-plugin/scripts/iris-tools/tests/deploy-atelier-frontend.test.js
      - if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\tests\iris-deploy-manifest.tests.ps1
