name: Deployment protection
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: ['22.5.0', '22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test plugins/coding-iris-plugin/scripts/iris-tools/tests/cls-format.test.js
      - run: node --test scripts/tests/iris-version-catalogs.tests.cjs
      - run: node --test scripts/tests/iris-development-mode.tests.js scripts/tests/iris-development-routing.tests.js scripts/tests/temp-directory.tests.js
      - if: runner.os != 'Windows'
        run: node --test scripts/tests/iris-offline-source.tests.cjs
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/iris-code-export/build-package.ps1
          node --test scripts/tests/iris-offline-powershell.tests.cjs
          node --test scripts/tests/iris-offline-source.tests.cjs
      - if: runner.os == 'Windows'
        env:
          IRIS_TEST_POWERSHELL: pwsh.exe
        run: node --test scripts/tests/iris-offline-powershell.tests.cjs scripts/tests/iris-offline-source.tests.cjs
      - run: node --test plugins/coding-iris-plugin/scripts/iris-tools/tests/deploy-recovery.test.cjs
      - run: node --test scripts/tests/iris-remote-operations.tests.js scripts/tests/iris-export-encoding.tests.js scripts/tests/iris-coding-fast-path.tests.js plugins/coding-iris-plugin/scripts/iris-tools/tests/source-sync.test.js plugins/coding-iris-plugin/scripts/iris-tools/tests/source-sync-transaction.test.cjs plugins/coding-iris-plugin/scripts/iris-tools/tests/source-publication.test.cjs plugins/coding-iris-plugin/scripts/iris-tools/tests/iris-demand-promote.test.js
      - run: node --test scripts/tests/atelier-read-pool.tests.js scripts/tests/iris-mcp-session.tests.js scripts/tests/iris-xml-distribution.tests.js plugins/coding-iris-plugin/scripts/iris-tools/tests/xml-package-core.test.js plugins/coding-iris-plugin/scripts/iris-tools/tests/xml-export.test.js plugins/coding-iris-plugin/scripts/iris-tools/tests/xml-package-source.test.js plugins/coding-iris-plugin/scripts/iris-tools/tests/code-baseline.test.js plugins/coding-iris-plugin/scripts/iris-tools/tests/baseline-catalog.test.js plugins/coding-iris-plugin/scripts/iris-tools/tests/xml-scope.test.js
      - run: node --test plugins/coding-iris-plugin/scripts/iris-tools/tests/project-env.test.js plugins/coding-iris-plugin/scripts/iris-tools/tests/deploy-direct.test.cjs plugins/coding-iris-plugin/scripts/iris-tools/tests/deploy-question.test.cjs plugins/coding-iris-plugin/scripts/iris-tools/tests/deploy-guard.test.cjs plugins/coding-iris-plugin/scripts/iris-tools/tests/deploy-frontend.test.js plugins/coding-iris-plugin/scripts/iris-tools/tests/compile-csp.test.js plugins/coding-iris-plugin/scripts/iris-tools/tests/sftp-worker.test.cjs
