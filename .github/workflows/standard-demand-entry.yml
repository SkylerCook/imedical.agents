name: Standard demand entry
on:
  push:
    paths: ['scripts/migrate-demand-ownership.js', 'scripts/generate-plugin-thin-index.ps1', 'scripts/update-agents.ps1', 'scripts/tests/demand-ownership-migration.tests.js', 'plugins/demand-delivery-plugin/scripts/commit-demand.js', 'plugins/demand-delivery-plugin/**', 'plugins/bos-plugin/scripts/demand-entry*.js', 'scripts/lib/workspace-context.js', 'scripts/tests/standard-demand-entry.tests.js', '.github/workflows/standard-demand-entry.yml']
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test scripts/tests/standard-demand-entry.tests.js scripts/tests/demand-ownership-migration.tests.js plugins/demand-delivery-plugin/tests/*.test.js
