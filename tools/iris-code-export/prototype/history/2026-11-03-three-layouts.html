function btn(text,act,kind='',icon=''){return `<button type="button" class="${kind}" data-act="${act}">${icon?I(icon):''}${text}</button>`;}
function header(){return `<header class="header"><div class="brand"><span class="brand-mark">${I('folder')}</span>项目源码基线</div><div class="row"><select class="project-select" id="hospital" aria-label="医院"><option>${esc(S.hospital)}</option><option>${S.hospital==='示例医院'?'另一示例项目':'示例医院'}</option></select><span class="pill">${esc(S.environment)}</span><span class="pill ${S.connection?'good':''}"><i class="dot"></i>${S.connection?'连接中':'未连接'}</span>${btn('设置','settings','plain small','gear')}</div></header>`;}
function baselineOverview(compact=false){const c=counts();return `<div class="${compact?'':'baseline-card card'}"><div class="row spread"><div><label>当前基线 · 持续增补到同一目录</label><div class="big-number">${c.files.toLocaleString()} <small>个已取得文件</small></div></div><div class="row">${btn('打开基线目录','folder','small','folder')}${btn('交付副本','delivery','small')}</div></div><div class="summary-grid"><div class="metric"><label>已登记范围</label><strong>${c.total.toLocaleString()}</strong> <span class="tiny muted">个对象</span></div><div class="metric"><label>需要处理</label><strong class="${c.issues?'danger':''}">${c.issues}</strong> <span class="tiny muted">项</span></div><div class="metric"><label>最近全范围检查</label><strong style="font-size:17px">${esc(S.lastFullCheck)}</strong><div class="tiny muted">按内容对比，不靠文件时间</div></div></div><span class="path">${I('folder')}${esc(folder())}</span></div>`;}
function banner(){
 if(S.scene==='auth')return `<section class="status-banner error" role="alert"><span class="banner-icon">!</span><div class="banner-content"><h3>认证未通过，本次检查没有开始</h3><p>请先检查账号和密码。当前基线中的 ${counts().files} 个文件保持原样。</p><div class="banner-actions">${btn('修改连接信息','settings','primary small')}${btn('查看错误详情','logs','small')}</div></div></section>`;
 if(S.scene==='changes')return `<section class="status-banner info" role="status"><span class="banner-icon">${I('refresh')}</span><div class="banner-content"><h3>发现 3 项可更新内容，另有 2 项需要核实</h3><p>新增 1 个 · 内容变化 2 个。1 个本地已修改、1 个远端本次未找到，都会保留当前文件。</p><div class="banner-actions">${btn('更新这 3 项到当前基线','apply','primary small','check')}${btn('只看变更','filter-changes','small')}${btn('查看对比','diff','small')}</div></div></section>`;
 if(S.scene==='running'||S.scene==='paused')return '';
 if(S.message)return `<section class="status-banner info" role="status"><span class="banner-icon">${I('check')}</span><div class="banner-content"><h3>${esc(S.message)}</h3><p>保存位置不变：${esc(folder())}</p></div></section>`;
 return '';
}
function clock(ms){const sec=Math.floor(ms/1000);return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');}
function activeElapsed(){const a=S.activity;return a? a.elapsedMs+(a.startedAt?Date.now()-a.startedAt:0):0;}
function activity(){const a=S.activity;if(!a)return '';const busy=S.scene==='running',paused=S.scene==='paused',error=S.scene==='auth';const pct=a.total?Math.round(a.processed/a.total*100):0;return `<section class="activity-card ${error?'error-state':''}" aria-label="采集进度与用时"><div class="activity-top"><div><div class="activity-name">${I(error?'shield':busy?'refresh':paused?'pause':'check')}${esc(a.type)} <span class="pill ${error?'bad':busy?'':a.missing+a.failed?'warn':'good'}">${error?'未能开始':paused?'已暂停':busy?'进行中':'已结束'}</span></div><div class="activity-stage" data-stage>${busy?'自动检查连接 → 取得源码 → 保存核对':paused?'已保存取得的文件，继续时在原目录接着处理，计时同步继续':error?'当前基线保留；请先处理上方错误':'本次结果与用时会一直保留，可从更新记录查看历次采集'}</div></div><div class="row"><div class="activity-clock"><small>${busy||paused?'本次已用':'本次用时'}</small><span data-clock>${clock(activeElapsed())}</span></div>${busy?btn('暂停','pause','small','pause'):paused?btn('继续','resume','primary small','arrow'):''}</div></div><div class="progress" role="progressbar" aria-label="本次采集进度" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div data-progress style="width:${pct}%"></div></div><div class="activity-stats"><span>已处理<strong data-processed>${a.processed} / ${a.total}</strong></span><span>成功<strong data-success>${a.success}</strong></span><span>未找到<strong data-missing>${a.missing}</strong></span><span>失败<strong data-failed>${a.failed}</strong></span><span class="blue" data-pct>${pct}%</span></div></section>`;}
function importStatus(){const a=S.importState;if(!a)return '';return `<section class="import-state" role="status"><b>${a.loading?'正在导入清单':a.error?'清单导入失败':'清单导入完成'} · ${esc(a.name)}</b><div class="progress"><div data-import-progress style="width:${a.percent}%"></div></div><div class="row"><span data-import-count>${a.loading?'读取 '+(a.loaded/1024).toFixed(0)+' / '+(a.total/1024).toFixed(0)+' KB':'识别 '+a.count+' 个对象 · 合并重复 '+a.duplicates+' 项'}</span><span class="time">导入用时 <b data-import-clock>${(a.elapsedMs/1000).toFixed(1)} 秒</b></span></div></section>`;}
function updateActivity(){const a=S.activity;if(!a)return;const n=Math.min(a.total,Math.floor(a.total*S.progress/100));a.processed=n;const q=S.runMode==='check'?S.records:(S.runQueue||[]).map(i=>S.records[i]);a.missing=q.slice(0,n).filter(r=>r.issue==='missing').length;a.failed=0;a.success=n-a.missing;document.querySelectorAll('[data-progress]').forEach(e=>e.style.width=S.progress+'%');document.querySelectorAll('[role=progressbar]').forEach(e=>e.setAttribute('aria-valuenow',S.progress));document.querySelectorAll('[data-clock]').forEach(e=>e.textContent=clock(activeElapsed()));document.querySelectorAll('[data-pct]').forEach(e=>e.textContent=S.progress+'%');document.querySelectorAll('[data-processed]').forEach(e=>e.textContent=n+' / '+a.total);document.querySelectorAll('[data-success]').forEach(e=>e.textContent=a.success);document.querySelectorAll('[data-missing]').forEach(e=>e.textContent=a.missing);document.querySelectorAll('[data-failed]').forEach(e=>e.textContent=a.failed);document.querySelectorAll('[data-stage]').forEach(e=>e.textContent=S.progress<15?'正在自动检查连接':S.progress<90?'正在取得源码；每取得一项就保存并核对':'正在核对保存结果，即将完成');}
function recordState(r){if(r.local)return '<span class="pill bad">本地已修改</span>';if(r.change==='modified')return '<span class="pill warn">服务器有变化</span>';if(r.change==='add')return '<span class="pill good">新取得，待接纳</span>';if(r.change==='notfound'||r.issue==='remote-missing')return '<span class="pill warn">远端未找到，保留旧版</span>';if(r.issue==='missing')return '<span class="pill warn">'+(r.ack?'本轮不再补取':'未取得 · 404')+'</span>';if(r.issue==='failed')return '<span class="pill bad">读取失败</span>';return '<span class="pill good">已归档</span>';}
function filtered(){return S.records.map((r,i)=>({...r,index:i})).filter(r=>(S.filter==='all'||(S.filter==='issues'&&(r.issue||r.local))||(S.filter==='changes'&&r.change)||(S.filter==='files'&&r.has))&&r.name.toLowerCase().includes(S.search.toLowerCase()));}
function table(){const c=counts(),list=filtered(),pages=Math.max(1,Math.ceil(list.length/10));S.page=Math.min(S.page,pages-1);const rows=list.slice(S.page*10,S.page*10+10);return `<section class="card table-card"><div class="table-head"><div class="tabs" role="group" aria-label="对象筛选">${[['all','全部范围',c.total],['files','当前文件',c.files],['issues','需处理',c.issues],...(S.scene==='changes'?[['changes','本次变化',S.records.filter(x=>x.change).length]]:[])].map(([v,t,n])=>`<button class="${S.filter===v?'active':''}" data-filter="${v}">${t} <span>${n}</span></button>`).join('')}</div><input class="search" id="search" aria-label="查找对象名称" placeholder="查找对象名…" value="${esc(S.search)}"></div><div class="table-actions"><span class="tiny muted">${S.selected.size?'已选择 '+S.selected.size+' 项':'对象名可直接选择复制，不必 OCR'}</span><div class="row">${btn('复制所选名称','copy-selected','small plain','copy')}${btn('复制未取得清单','copy-missing','small plain')}${btn('重试未取得项','retry','small')}</div></div><div id="rows-wrap"><table><thead><tr><th><input type="checkbox" id="all-visible" aria-label="选择当前页"></th><th>对象名</th><th>状态</th><th class="date-col">上次检查 / 内容更新</th><th></th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td><input type="checkbox" data-index="${r.index}" ${S.selected.has(r.index)?'checked':''} aria-label="选择 ${esc(r.name)}"></td><td class="name">${esc(r.name)}${r.has&&r.issue?'<div class="sub">当前文件保留，不会因读取失败删除</div>':''}</td><td>${recordState(r)}</td><td class="date-col muted">${esc(r.checked)}<div class="tiny">${esc(r.updated||'尚未取得')}</div></td><td><button class="copy" data-copy="${r.index}">${I('copy')}复制</button>${r.change==='modified'?`<button class="copy" data-diff="${r.index}">对比</button>`:''}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">没有符合条件的对象</td></tr>'}</tbody></table></div><div class="pagination"><span>显示 ${list.length?S.page*10+1:0}–${Math.min(list.length,(S.page+1)*10)} / ${list.length} 项</span><div class="row">${btn('‹ 上一页','prev','small')}${btn('下一页 ›','next','small')}</div></div></section>`;}
function logs(){return `<details class="logs" id="logs" ${S.scene==='auth'?'open':''}><summary>${S.scene==='auth'?'错误详情 · 已自动展开':'操作记录与诊断详情'}</summary><pre>${S.scene==='auth'?'本次操作：检查更新\n结果：HTTP 401，认证未通过\n后续：核对凭据；退出或会话状态不确定时仍需核查\n当前基线：保留，不覆盖、不删除':`本次项目：${esc(S.hospital)} / ${esc(S.environment)}\n基线目录：${esc(folder())}\n当前文件：${counts().files}；登记范围：${counts().total}\n每次采集的来源、范围、摘要和恢复信息由工具内部保存\n这里只展示示例，不连接真实服务器`}</pre></details>`;}
function VariantA(){return `${header()}<div class="workspace"><div class="lead"><div><h1>这家医院的源码，都在这里。</h1><p>补新对象、检查变化、继续上次采集。始终维护同一份基线。</p></div><div class="row">${btn('检查更新','check','','refresh')}${btn('增补源码','add','primary','plus')}</div></div><div class="a-layout"><aside><section class="card side-card"><h2>往当前基线补源码</h2><p class="tiny muted">粘贴清单或导入文件，自动去重，只补需要取得的对象。</p><div class="upload-mini" data-drop>${I('upload')}<h3>拖入 TXT 或源码 XML</h3><div class="tiny muted">XML 只提取类名，不向服务器导入</div><div class="source-methods">${btn('选择文件','file','small')}${btn('粘贴清单','add','small')}</div></div><div class="rule"></div>${btn('按版本补充范围','version','block','file')}<div class="folder-note"><strong>${I('folder')}最终就是这一份目录</strong>${esc(folder())}<br>增补、重试、检查更新都不会另建交付目录。</div></section><div class="sidebar-steps"><span>${I('shield')}默认稳妥单会话，无需勾选试读</span><span>${I('history')}历史版本与采集记录自动保留</span>${btn('查看更新记录','history','plain small','clock')}</div></aside><div class="stack"><div>${baselineOverview()}</div><div>${banner()}${activity()}${table()}${logs()}</div></div></div></div>`;}
function VariantB(){const c=counts();return `${header()}<div class="b-shell"><div class="b-title"><h1>一份基线，持续补齐。</h1><p>准备好清单，其余交给工具。</p></div>${banner()}<div class="b-ribbon"><span class="${S.scene==='baseline'?'on':''}"><i>1</i>选择内容</span><span class="${S.scene==='running'?'on':''}"><i>2</i>自动采集与核对</span><span class="${S.scene==='changes'?'on':''}"><i>3</i>查看结果</span></div><section class="b-drop" data-drop>${I('upload')}<h2>把清单拖到这里</h2><p>支持 TXT、IRIS 源码 XML，也可以直接粘贴对象名。</p><div class="row" style="justify-content:center">${btn('选择文件','file','primary','upload')}${btn('粘贴对象名','add','','file')}</div><div class="tiny muted" style="margin-top:18px">补充到 ${esc(S.hospital)} · ${esc(S.environment)} 的当前基线，不会新建一套目录。</div></section><div class="b-choices"><button data-act="version">${I('file')}<b>没有清单？按版本补充</b><small>选择版本，取得该范围内还缺少的对象</small></button><button data-act="check">${I('refresh')}<b>想知道服务器有何变化？</b><small>重新采集、按内容比较，再更新基线</small></button><button data-act="history">${I('history')}<b>查看之前的变化</b><small>按采集记录对比与恢复，不用找批次目录</small></button></div><div class="b-content"><section class="card b-overview"><div><label>当前基线</label><div class="big-number">${c.files} <small>个文件，持续累积</small></div><span class="path">${I('folder')}${esc(folder())}</span></div><div class="row">${btn('打开基线目录','folder','','folder')}${btn('交付副本','delivery')}</div></section>${activity()}${table()}${logs()}</div></div>`;}
function VariantC(){const c=counts();return `${header()}<div class="c-shell"><aside class="c-nav"><div class="section-title">我的项目</div><div class="tree-item active">${I('folder')}${esc(S.hospital)}</div><div class="tree-item indent">${I('folder')}${esc(S.environment)}</div><div class="section-title">当前基线</div><button class="tree-item active block" data-filter="all">${I('file')}所有对象<span class="count">${c.total}</span></button><button class="tree-item block" data-filter="files">${I('check')}已取得文件<span class="count">${c.files}</span></button><button class="tree-item block" data-filter="issues">${I('shield')}需要处理<span class="count">${c.issues}</span></button><div class="section-title">采集与版本</div><button class="tree-item block" data-act="history">${I('history')}更新记录</button><button class="tree-item block" data-act="settings">${I('gear')}项目设置</button><div class="folder-note">同一项目持续维护。内部采集记录不需要手工整理。</div></aside><section class="c-main"><div class="c-breadcrumb">我的项目 <span>›</span> ${esc(S.hospital)} <span>›</span> ${esc(S.environment)} <span>›</span> 当前基线</div><div class="c-inspector"><div><h1>当前源码基线</h1><p>${esc(folder())}</p></div><div class="c-stat"><b>${c.files}</b>已取得文件 / ${c.total} 个登记对象</div></div><div class="c-toolbar">${btn('增补源码','add','primary','plus')}${btn('检查更新','check','','refresh')}${btn('按版本补充','version','','file')}${btn('打开目录','folder','','folder')}${btn('历史对比','history','plain','history')}${btn('交付副本','delivery','plain')}</div>${banner()}${activity()}${table()}<div class="c-footnote">内容未变，文件修改时间就保留；“上次检查”单独记录实际重新采集的时间。</div>${logs()}</section></div>`;}
function dialog(){if(!S.modal)return '';let content='',title='',sub='',foot='';
 if(S.modal==='add'){title='增补到当前基线';sub=S.hospital+' · '+S.environment+' · '+folder();content=`<div class="tabs source-tabs">${[['paste','粘贴对象名'],['file','TXT / 源码 XML'],['version','按版本补充']].map(([v,t])=>`<button class="${S.sourceTab===v?'active':''}" data-source="${v}">${t}</button>`).join('')}</div>${importStatus()}${S.sourceTab==='paste'?`<label for="names">每行一个完整对象名 · 已取得且一致的对象会跳过</label><textarea id="names" class="dialog-list" rows="9" spellcheck="false">${esc(S.draft)}</textarea><div class="tiny muted" style="margin-top:8px">清单可调整高度，也可直接选中复制。</div>`:S.sourceTab==='file'?`<div class="upload-full" data-drop>${I('upload')}<h3>拖入 TXT 或源码 XML</h3><span class="tiny muted">本地读取清单，不上传文件</span>${btn('选择文件','file','primary')}</div>${S.draft?`<div class="field"><label>已识别的对象</label><textarea id="names" rows="9" class="dialog-list">${esc(S.draft)}</textarea></div>`:''}`:`<div class="field"><label>选择版本范围</label><select id="version"><option value="v8.5">v8.5 医生站</option><option value="v9.0">v9.0 医生站</option><option value="v9.1">v9.1 医生站</option></select></div><div class="inline-info">将版本清单并入本项目的登记范围，已取得文件保留。版本代表范围，取得的是服务器当前源码。</div>`}<div class="inline-info">${I('folder')}仍保存到 ${esc(folder())}<br>会自动检查连接、处理重复对象并核对保存结果，无需另外做一次试读。</div>`;foot=`<span class="tiny muted">本次增补不改变既有文件</span><div class="row">${btn('取消','cancel')}${btn('增补到当前基线','run-add','primary','arrow')}</div>`;}
 if(S.modal==='settings'){title='项目连接与保存位置';sub='只需设置一次，后续直接使用';content=`<div class="two"><div class="field"><label>项目名称</label><input id="project-name" value="${esc(S.hospital)}"></div><div class="field"><label>环境</label><select id="environment"><option>${esc(S.environment)}</option><option>${S.environment==='正式环境'?'测试环境':'正式环境'}</option></select></div></div><div class="field"><label>基线目录</label><input readonly value="${esc(folder())}"></div><div class="inline-info">优先复用已有连接配置；没有配置时一次性填写，日常页面不显示专业参数。</div><details><summary class="tiny muted">查看连接参数（示例）</summary><div class="field"><label>接口地址</label><input placeholder="填写项目提供的接口地址"></div><div class="two"><div class="field"><label>用户名</label><input value="demo_user"></div><div class="field"><label>密码</label><input type="password" value="prototype-only"></div></div><div class="field"><label>Namespace</label><input value="DEMO"></div></details>`;foot=`<span class="tiny muted">原型不保存真实配置</span>${btn('完成','save-settings','primary')}`;}
 if(S.modal==='delivery'){title='交付一份完整的当前源码副本';sub='选定版本后冻结，后续基线增补不会改变这份副本';content=`<div class="summary-grid"><div class="metric"><label>已取得源码</label><strong>${counts().files}</strong></div><div class="metric"><label>登记范围</label><strong>${counts().total}</strong></div><div class="metric"><label>尚未取得</label><strong>${S.records.filter(r=>!r.has).length}</strong></div></div><div class="inline-info">一个交付文件夹：源码 + 来源/范围说明 + 未取得对象清单。内部采集历史不要求手工合并；未取得项仍如实列明。</div><p class="tiny muted">用于离线开发时，这份副本保留确定的原始内容，与持续维护的项目基线分开。</p>`;foot=`<span class="tiny muted">原型仅展示交付方式，不实际写入文件</span>${btn('生成交付文件夹','make-delivery','primary')}`;}
 if(S.modal==='folder'){title='这一份，就是项目的当前基线';sub=folder();content=`<div class="stack"><div>${I('folder')} <b>src /</b><p class="tiny muted" style="padding-left:26px">${counts().files} 个已取得的当前源码文件，日常查看与交付使用这一份。</p></div><div>${I('file')} <b>基线说明.txt</b><p class="tiny muted" style="padding-left:26px">来源、范围、检查时间，以及尚未取得的数量。</p></div><div>${I('file')} <b>未取得对象.txt</b><p class="tiny muted" style="padding-left:26px">尚未取得的对象，可直接复制核实。</p></div><div>${I('history')} <b>内部采集与版本记录</b><p class="tiny muted" style="padding-left:26px">工具管理断点、变更前后版本及恢复信息，不需要你合并文件夹。</p></div></div>`;foot=`<span class="tiny muted">同一基线，增补与更新后路径不变</span>${btn('知道了','cancel','primary')}`;}
 if(S.modal==='history'){title='每次采集有记录，当前基线只有一份';sub='可以追溯增补与变化，无需手动寻找多个批次';content=[...S.history,{when:'昨天 16:10',elapsedMs:84000,name:'检查更新',note:'内容未变，更新检查时间，文件修改时间保留。'},{when:'11-01 14:20',name:'增补类清单',note:'取得 57 个新对象，与原基线合并保存。'},{when:'10-30 09:25',name:'建立项目基线',note:'第一次采集，创建当前项目目录。'}].map(h=>`<div class="history-row"><div class="stamp">${esc(h.when)}</div><div><b>${esc(h.name)}</b>${h.elapsedMs!==undefined?'<span class="pill" style="margin-left:10px">用时 '+clock(h.elapsedMs)+'</span>':''}<small>${esc(h.note)}</small></div></div>`).join('');foot=`<span class="tiny muted">新增、修改、未取得和未变化分别记录</span>${btn('关闭','cancel','primary')}`;}
 if(S.modal==='copy'){title='完整对象名';sub='选中后可直接复制，内容可用于服务器核实';content=`<textarea rows="9" class="dialog-list" readonly>${esc(S.copyDraft||'')}</textarea>`;foot=btn('关闭','cancel','primary');}
 if(S.modal==='diff'){const r=S.records[S.diffIndex??1];title='查看内容变化';sub=r.name;content=`<div class="row" style="margin-bottom:16px"><span class="pill warn">服务器内容发生变化</span><span class="tiny muted">按内容摘要判断，与文件时间无关</span></div><div class="diff"><section class="old"><b>当前基线 · ${esc(r.updated)}</b>Class ${esc(r.name.replace('.cls',''))}<br>{<br>&nbsp;quit "before"<br>}</section><section class="new"><b>本次从服务器取得</b>Class ${esc(r.name.replace('.cls',''))}<br>{<br>&nbsp;quit "after"<br>}</section></div><div class="inline-info">采集记录会保留旧版。若当前文件已被本地修改，工具停止覆盖并单独提示。</div>`;foot=`<span class="tiny muted">这里只演示对比交互</span>${btn('返回变更清单','cancel','primary')}`;}
 return `<dialog id="dialog"><div class="dialog-head"><div><h2>${title}</h2><p class="tiny muted" style="margin-top:6px;overflow-wrap:anywhere">${esc(sub)}</p></div><button class="plain small" data-act="cancel" aria-label="关闭对话框">${I('close')}</button></div><div class="dialog-body">${content}</div><div class="dialog-foot">${foot}</div></dialog>`;
}
function render(){document.getElementById('app').innerHTML=({A:VariantA,B:VariantB,C:VariantC}[S.variant])();document.getElementById('modal-root').innerHTML=dialog();if(S.modal){const d=document.getElementById('dialog');d.showModal();d.addEventListener('close',()=>{S.modal=null;});}renderSwitcher();wireDrops();}
function renderSwitcher(){const c=counts(),bar=document.getElementById('switcher');bar.innerHTML=`<span class="proto-label">原型比较</span>${btn('←','variant-prev')}<div class="row">${Object.entries(variants).map(([key,name])=>`<button data-variant="${key}" class="${S.variant===key?'active':''}">${key} ${name}</button>`).join('')}</div>${btn('→','variant-next')}<span class="divider"></span><select id="scene" aria-label="演示场景">${Object.entries(scenes).map(([v,t])=>`<option value="${v}" ${S.scene===v?'selected':''}>${t}</option>`).join('')}</select><span class="prototype-state" aria-live="polite">${S.variant} · 当前基线 ${c.files} 文件 · 登记 ${c.total} 对象 · ${c.issues} 项待处理 · 同一目录 · 示例状态</span>`;bar.hidden=!(location.protocol==='file:'||['127.0.0.1','localhost'].includes(location.hostname));const url=new URL(location.href);url.searchParams.set('variant',S.variant);url.searchParams.set('scene',scenes[S.scene]?S.scene:'baseline');history.replaceState(null,'',url);}
function notify(text){const el=document.getElementById('toast');el.textContent=text;el.classList.remove('hidden');clearTimeout(notify.t);notify.t=setTimeout(()=>el.classList.add('hidden'),2600);}
function open(type){S.modal=type;render();}
function stageChanges(){S.records.forEach(r=>r.change=null);S.records[1].change='modified';S.records[7].change='modified';const missing=S.records.find(r=>!r.has);if(missing)missing.change='add';S.records[5].change='notfound';S.records[5].issue='remote-missing';S.records[9].change='modified';S.records[9].local=true;}
function chooseScene(scene){clearInterval(timer);S.scene=scene;S.message='';S.records=makeRecords();S.selected.clear();S.filter=scene==='changes'?'changes':'all';S.search='';S.page=0;S.lastFullCheck=scene==='changes'?'刚刚':'昨天 16:10';if(scene==='changes')stageChanges();if(scene==='running'){S.runMode='add';S.progress=38;}S.connection=scene==='running';S.activity={type:scene==='changes'||scene==='auth'?'检查更新':'增补源码',total:S.records.length,processed:scene==='auth'?0:S.records.length,success:scene==='auth'?0:553,missing:scene==='auth'?0:3,failed:scene==='auth'?0:1,elapsedMs:scene==='auth'?1200:84000,startedAt:null};if(scene==='running'){S.runQueue=[553,554,555,556];S.activity={type:'缺失补取',total:4,processed:1,success:0,missing:1,failed:0,elapsedMs:32000,startedAt:Date.now()};}render();if(scene==='running')animate();}
function startRun(mode,queue=[]){S.modal=null;S.runMode=mode;S.runQueue=queue;S.scene='running';S.connection=true;S.progress=0;S.message='';S.activity={type:mode==='check'?'检查更新':mode==='retry'?'缺失补取':'增补源码',total:mode==='check'?S.records.length:queue.length,processed:0,success:0,missing:0,failed:0,elapsedMs:0,startedAt:Date.now()};render();animate();}
function animate(){clearInterval(timer);timer=setInterval(()=>{S.progress=Math.min(100,S.progress+13);updateActivity();if(S.progress===100){clearInterval(timer);S.activity.elapsedMs=activeElapsed();S.activity.startedAt=null;if(S.runMode==='check'){S.scene='changes';S.connection=false;S.lastFullCheck='刚刚';S.filter='changes';stageChanges();S.records.forEach(r=>r.checked='刚刚');S.activity.missing=S.records.filter(r=>r.change==='notfound'||r.issue==='missing'&&r.change!=='add').length;S.activity.failed=S.records.filter(r=>r.issue==='failed').length;S.activity.success=S.activity.total-S.activity.missing-S.activity.failed;S.history.unshift({when:'刚刚',elapsedMs:S.activity.elapsedMs,name:'检查更新',note:'独立采集后发现 3 项可接纳变化，当前基线尚未覆盖。'});render();}else{let added=0;for(const i of (S.runQueue||[])){const r=S.records[i];if(r.issue==='missing'){r.checked='刚刚';continue;}if(!r.has)added++;r.has=true;r.issue=null;r.checked='刚刚';r.updated='刚刚';}S.scene='baseline';S.connection=false;S.message=`本次取得 ${added} 个对象，已并入当前基线`;S.history.unshift({when:'刚刚',elapsedMs:S.activity.elapsedMs,name:'增补源码',note:`取得 ${added} 个对象；重复项保留原文件，未取得项继续列明。`});S.filter='all';render();}}},260);}
function pendingNames(){const el=document.getElementById('names');if(el)S.draft=el.value;return S.draft.split(/\r?\n/).map(x=>x.trim()).filter(x=>x&&!x.startsWith('#'));}
function append(){const names=S.sourceTab==='version'?['Demo.Version.Extra1.cls','Demo.Version.Extra2.cls','Demo.Order.Entry.cls']:pendingNames();const exact=new Map(S.records.map((r,i)=>[r.name,i])),folded=new Map(S.records.map(r=>[r.name.toLowerCase(),r.name]));let duplicates=0;const queue=[];for(const name of [...new Set(names)]){if(folded.has(name.toLowerCase())&&!exact.has(name)){notify('存在仅大小写不同的对象名，请先核实');return;}if(exact.has(name)){const i=exact.get(name);if(S.records[i].has)duplicates++;else queue.push(i);}else{const i=S.records.length;S.records.push({name,has:false,issue:null,checked:'尚未检查',updated:'尚未取得',change:null,local:false,ack:false});exact.set(name,i);folded.set(name.toLowerCase(),name);queue.push(i);}}if(!names.length){notify('请粘贴对象名或选择清单文件');return;}if(!queue.length){S.modal=null;S.message=`这 ${duplicates} 个对象已在当前基线中，无需重复取得`;render();return;}notify(`需要取得 ${queue.length} 项，${duplicates} 个已有对象跳过；目录不变`);startRun('add',queue);}
async function importFile(file){if(!file)return;const started=performance.now();S.importState={name:file.name,loading:true,total:file.size,loaded:0,percent:0,count:0,duplicates:0,elapsedMs:0};S.sourceTab='file';S.modal='add';S.draft='';render();const reader=new FileReader();reader.onprogress=e=>{const a=S.importState;a.loaded=e.loaded;a.percent=e.lengthComputable?Math.round(e.loaded/e.total*95):50;a.elapsedMs=performance.now()-started;document.querySelectorAll('[data-import-progress]').forEach(el=>el.style.width=a.percent+'%');document.querySelectorAll('[data-import-count]').forEach(el=>el.textContent='读取 '+(e.loaded/1024).toFixed(0)+' / '+(file.size/1024).toFixed(0)+' KB');document.querySelectorAll('[data-import-clock]').forEach(el=>el.textContent=(a.elapsedMs/1000).toFixed(1)+' 秒');};reader.onload=()=>{let text=reader.result,names;try{if(/\.xml$/i.test(file.name)){if(/<!DOCTYPE/i.test(text))throw Error('不支持含 DTD 的 XML');const xml=new DOMParser().parseFromString(text,'application/xml');if(xml.querySelector('parsererror')||xml.documentElement.nodeName!=='Export')throw Error('请选择 IRIS 源码 Export XML');names=[...xml.documentElement.children].filter(e=>e.nodeName==='Class').map(e=>e.getAttribute('name')+'.cls');}else names=text.split(/\r?\n/).map(x=>x.trim()).filter(x=>x&&!x.startsWith('#'));if(!names.length)throw Error('文件中没有可用对象名');const unique=[...new Set(names)];S.draft=unique.join('\n');Object.assign(S.importState,{loading:false,loaded:file.size,percent:100,count:unique.length,duplicates:names.length-unique.length,elapsedMs:performance.now()-started});S.sourceTab='paste';render();notify('已识别 '+unique.length+' 个对象，确认后增补到同一基线');}catch(error){Object.assign(S.importState,{loading:false,error:true,elapsedMs:performance.now()-started});render();notify(error.message);}};reader.onerror=()=>{Object.assign(S.importState,{loading:false,error:true,elapsedMs:performance.now()-started});render();notify('无法读取清单，请重新选择文件');};reader.readAsText(file);}
function pickFile(){const f=document.createElement('input');f.type='file';f.accept='.txt,.xml';f.style.display='none';document.body.appendChild(f);f.onchange=()=>{importFile(f.files[0]);f.remove();};f.oncancel=()=>f.remove();f.click();}
function wireDrops(){document.querySelectorAll('[data-drop]').forEach(e=>{e.ondragover=ev=>{ev.preventDefault();e.style.borderColor='var(--blue)';};e.ondragleave=()=>e.style.borderColor='';e.ondrop=ev=>{ev.preventDefault();importFile(ev.dataTransfer.files[0]);};});}
async function copyNames(names){if(!names.length){notify('先选中对象行，或复制未取得清单');return;}try{await navigator.clipboard.writeText(names.join('\r\n'));notify(`已复制 ${names.length} 个完整对象名`);}catch{S.copyDraft=names.join('\n');S.modal='copy';render();notify('清单已展开，可选中后按 Ctrl+C');}}
function action(act){switch(act){case'add':S.sourceTab='paste';open('add');break;case'version':S.sourceTab='version';open('add');break;case'file':pickFile();break;case'run-add':append();break;case'check':startRun('check');break;case'pause':clearInterval(timer);S.activity.elapsedMs=activeElapsed();S.activity.startedAt=null;S.scene='paused';render();break;case'resume':S.activity.startedAt=Date.now();S.scene='running';render();animate();break;case'apply':{let n=0;for(const r of S.records){if(r.change&&r.change!=='notfound'&&!r.local){r.has=true;r.issue=null;r.updated='刚刚';r.checked='刚刚';r.change=null;n++;}else if(r.change==='notfound'){r.issue='remote-missing';r.change=null;}}S.scene='baseline';S.filter='issues';S.message=`已更新 ${n} 个对象；本地改动和远端未找到的文件均已保留`;S.history.unshift({when:'刚刚',name:'更新当前基线',note:`接纳 ${n} 项变化，保留变更前版本与本次采集记录。`});render();break;}case'filter-changes':S.filter='changes';render();break;case'retry':{const q=S.records.map((r,i)=>({r,i})).filter(x=>!x.r.has&&x.r.issue&&!x.r.ack).map(x=>x.i);if(q.length)startRun('retry',q);else notify('当前没有可直接重试的未取得对象');break;}case'copy-selected':copyNames([...S.selected].map(i=>S.records[i].name));break;case'copy-missing':copyNames(S.records.filter(r=>!r.has).map(r=>r.name));break;case'folder':open('folder');break;case'delivery':open('delivery');break;case'make-delivery':S.modal=null;render();notify('已演示生成一份冻结交付副本；原型未写入磁盘');break;case'history':open('history');break;case'settings':open('settings');break;case'save-settings':{const project=document.getElementById('project-name').value.trim(),env=document.getElementById('environment').value;if(project&&project!==S.hospital||env!==S.environment){S.hospital=project||S.hospital;S.environment=env;S.records=makeRecords();S.message='已切换项目或环境，基线独立管理，不混入原目录';}else S.message='连接设置已确认（原型演示），可以重新检查';S.scene='baseline';S.modal=null;render();break;}case'diff':S.diffIndex=1;open('diff');break;case'logs':document.getElementById('logs').open=true;document.getElementById('logs').scrollIntoView({behavior:'smooth',block:'center'});break;case'cancel':S.modal=null;render();break;case'prev':S.page=Math.max(0,S.page-1);render();break;case'next':S.page++;render();break;case'variant-prev':changeVariant(-1);break;case'variant-next':changeVariant(1);break;}}
function changeVariant(n){const keys=Object.keys(variants);S.variant=keys[(keys.indexOf(S.variant)+n+keys.length)%keys.length];render();}
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]'),v=e.target.closest('[data-variant]'),f=e.target.closest('[data-filter]'),c=e.target.closest('[data-copy]'),d=e.target.closest('[data-diff]'),source=e.target.closest('[data-source]');if(a)action(a.dataset.act);else if(v){S.variant=v.dataset.variant;render();}else if(f){S.filter=f.dataset.filter;S.page=0;render();}else if(c)copyNames([S.records[Number(c.dataset.copy)].name]);else if(d){S.diffIndex=Number(d.dataset.diff);open('diff');}else if(source){const names=document.getElementById('names');if(names)S.draft=names.value;S.sourceTab=source.dataset.source;render();}});
document.addEventListener('change',e=>{if(e.target.id==='scene')chooseScene(e.target.value);if(e.target.id==='hospital'){S.hospital=e.target.value;S.records=makeRecords();S.history=[];S.message='已切换到这家医院的独立基线';render();}if(e.target.matches('[data-index]')){const i=Number(e.target.dataset.index);if(e.target.checked)S.selected.add(i);else S.selected.delete(i);render();}if(e.target.id==='all-visible'){for(const r of filtered().slice(S.page*10,S.page*10+10)){if(e.target.checked)S.selected.add(r.index);else S.selected.delete(r.index);}render();}});
document.addEventListener('input',e=>{if(e.target.id==='names')S.draft=e.target.value;if(e.target.id==='search'){S.search=e.target.value;S.page=0;const pos=e.target.selectionStart;render();const search=document.getElementById('search');search.focus();search.setSelectionRange(pos,pos);}});
document.addEventListener('keydown',e=>{if(S.modal||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowLeft'){e.preventDefault();changeVariant(-1);}if(e.key==='ArrowRight'){e.preventDefault();changeVariant(1);}});
window.addEventListener('popstate',()=>{const u=new URL(location.href);S.variant=variants[u.searchParams.get('variant')]?u.searchParams.get('variant'):'A';render();});
chooseScene(S.scene);
</script>
